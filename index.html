<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARKX HUB — Ghala la Tools za DarkX</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="nav-slot"></div>

<header class="hero">
  <div class="container hero-grid">
    <div class="hero-copy">
      <div class="eyebrow-line"><span class="dot"></span> DARKX HUB — Live</div>
      <h1>Tools zote za <span>DarkX</span>,<br> mahali pamoja.</h1>
      <p class="lead">Pakua, chunguza, na uchapishe tools za DarkX — bots, script, na miradi mingine — kwenye ghala moja lililopangwa kama Play Store.</p>
      <div class="hero-actions">
        <a href="/upload" class="btn btn-primary">Weka Tool Yako</a>
        <a href="#tools" class="btn btn-ghost">Vinjari Tools</a>
      </div>
      <div class="stat-row" id="stat-row">
        <div class="stat-cell"><div class="stat-num" id="stat-tools">—</div><div class="stat-label">Tools zilizopo</div></div>
        <div class="stat-cell"><div class="stat-num" id="stat-downloads">—</div><div class="stat-label">Downloads</div></div>
        <div class="stat-cell"><div class="stat-num" id="stat-cats">—</div><div class="stat-label">Categories</div></div>
      </div>
    </div>
    <div class="hero-visual">
      <svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2F6FED"/>
            <stop offset="100%" stop-color="#22D3EE"/>
          </linearGradient>
        </defs>
        <g opacity="0.55" stroke="#2F6FED" stroke-width="1">
          <line x1="20" y1="40" x2="380" y2="40"/>
          <line x1="20" y1="100" x2="380" y2="100"/>
          <line x1="20" y1="160" x2="380" y2="160"/>
          <line x1="20" y1="220" x2="380" y2="220"/>
          <line x1="20" y1="280" x2="380" y2="280"/>
        </g>
        <rect x="60" y="70" width="90" height="90" rx="16" fill="url(#g1)" opacity="0.85"/>
        <rect x="180" y="150" width="70" height="70" rx="14" fill="#0F1730" stroke="#22D3EE" stroke-width="1.5"/>
        <circle cx="300" cy="90" r="42" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.8"/>
        <circle cx="300" cy="90" r="6" fill="#22D3EE"/>
        <rect x="250" y="220" width="110" height="16" rx="8" fill="#151F42"/>
        <rect x="250" y="220" width="70" height="16" rx="8" fill="#4C8CFF"/>
      </svg>
    </div>
  </div>
</header>

<main class="container section" id="tools">
  <div class="section-head">
    <h2>Vinjari Tools</h2>
    <span class="sub" id="result-count"></span>
  </div>
  <div class="chip-row" id="chip-row">
    <button class="chip active" data-cat="">Zote</button>
  </div>
  <div id="tool-grid" class="tool-grid">
    <div class="empty-state"><div class="spinner" style="margin:0 auto"></div></div>
  </div>
</main>

<div id="footer-slot"></div>

<script src="/api.js"></script>
<script src="/home.js"></script>
</body>
</html>
